# Managed by BriqueParBrique/nouvelle-brique — do not edit in brick repos
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Read config
        id: config
        run: |
          BASEURL=$(ruby -ryaml -e "puts YAML.load_file('_config.yml')['baseurl']")
          # Hôte du site, échappé pour servir dans une expression régulière.
          SITEHOST=$(ruby -ryaml -ruri -e "puts Regexp.escape(URI(YAML.load_file('_config.yml')['url']).host)")
          echo "baseurl=${BASEURL}" >> "$GITHUB_OUTPUT"
          echo "sitehost=${SITEHOST}" >> "$GITHUB_OUTPUT"

      # Deux familles d'URL sont exclues de la validation :
      #
      # - briqueparbrique.github.io : le lien canonique de la page courante et les
      #   liens vers les autres niveaux (qui vivent dans d'autres dépôts). Les
      #   vérifier ferait dépendre la CI de l'état du site déjà publié, et
      #   échouerait pour toute brique pas encore en ligne.
      # - github.com : les liens « Modifier cette page » et « Signaler un
      #   problème » pointent vers /edit/ et /issues/new, que GitHub sert en 404
      #   à un visiteur non authentifié.
      #
      # Les vrais liens externes du contenu pédagogique restent vérifiés.
      # Les entrées entourées de « / » sont interprétées comme des expressions
      # régulières par html-proofer.
      - name: Validate HTML
        run: |
          bundle exec htmlproofer _site \
            --ignore-urls "/^#/,/${{ steps.config.outputs.sitehost }}/,/^https:..github\.com./" \
            --no-enforce-https \
            --swap-urls "^${{ steps.config.outputs.baseurl }}/:/"

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
